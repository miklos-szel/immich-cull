name: ImmichCull
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGNING_ALLOWED: "YES"
targets:
  ImmichCull:
    type: application
    platform: iOS
    sources:
      - ImmichCull
    info:
      path: ImmichCull/Info.plist
      properties:
        CFBundleDisplayName: immich-cull
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: ImmichCull scans your local network to find Immich servers.
        NSPhotoLibraryUsageDescription: ImmichCull can remove photos you trash from this iPhone's photo library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ImmichCull
        # The release version lives here, not in Info.plist — XcodeGen
        # regenerates that file and would overwrite a bump made there.
        # scripts/release.sh rewrites these two lines.
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - ImmichCullUITests
  ImmichCullMac:
    type: application
    platform: macOS
    sources:
      - ImmichCullMac
      - path: ImmichCull/Models
      - path: ImmichCull/Networking
      - path: ImmichCull/Services
        excludes:
          - BlurAnalyzer.swift
          - BlurScanSession.swift
          - ScreenshotDetector.swift
    info:
      path: ImmichCullMac/Info.plist
      properties:
        CFBundleDisplayName: immich-cull
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.photography
        NSPhotoLibraryUsageDescription: immich-cull removes photos you trash from this Mac's Photos library.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: ImmichCullMac/ImmichCullMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.photos-library: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ImmichCullMac
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "3"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - ImmichCullTests
  # Unit tests for the shared layer (CullSession, ImmichClient, the matching
  # rules). Unhosted and on macOS, so they compile the shared sources directly
  # and run without a simulator; the server is a URLProtocol stub.
  ImmichCullTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ImmichCullTests
      - path: ImmichCull/Models
      - path: ImmichCull/Networking
      - path: ImmichCull/Services
        excludes:
          - BlurAnalyzer.swift
          - BlurScanSession.swift
          - ScreenshotDetector.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ImmichCullTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
  ImmichCullUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ImmichCullUITests
    dependencies:
      - target: ImmichCull
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ImmichCullUITests
        TEST_TARGET_NAME: ImmichCull
        GENERATE_INFOPLIST_FILE: YES
